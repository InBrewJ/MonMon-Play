version: '3.8'

services:
  rauthy:
    container_name: rauthy
    image: ghcr.io/sebadob/rauthy:latest
    command: ["serve", "-c", "/app/rauthy.cfg"]
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./rust-rewrite/rauthy/config.toml:/app/rauthy.cfg:ro
      - ./rust-rewrite/rauthy/bootstrap:/app/bootstrap:ro
      - ./rust-rewrite/rauthy/data:/app/data
    ports:
      - "8085:8085"
      - "8443:8443"
    restart: always

  legmon:
    container_name: legmon-rs
    build:
      context: ./rust-rewrite/legmon-rs
      dockerfile: Dockerfile
    environment:
      - PORT=9005
      - MONMON_HOST=monmon-rs
      - MONMON_PORT=9001
    ports:
      - "9005:9005"
    restart: always

  monmon:
    container_name: monmon-rs
    build:
      context: ./rust-rewrite/monmon-rs
      dockerfile: Dockerfile
    environment:
      - PORT=9001
      - DB_URL=postgres://postgres:docker@postgres:5432/monmon-rust
      - AUTH_URL=http://localhost:8085/auth/v1/oidc/authorize
      - REDIRECT_URI=http://localhost:9001/callback
      - LEGMON_URL=http://legmon-rs:9005
    ports:
      - "9001:9001"
    depends_on:
      - rauthy
      - legmon
    restart: always

networks:
  default:
    name: monmon-play_default
    external: true
