services:
  rauthy:
    container_name: rauthy
    image: ghcr.io/sebadob/rauthy:0.37.2
    command: ["serve", "-c", "/app/rauthy.cfg"]
    env_file:
      - .env
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./modules/rauthy/config.toml:/app/rauthy.cfg:ro
      - ./modules/rauthy/bootstrap:/app/bootstrap:ro
      - ./modules/rauthy/data:/app/data
    network_mode: host
    restart: always

  legmon:
    container_name: legmon-rs
    image: legmon-rs:latest
    build:
      context: ./modules/legmon-rs
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=9005
      - MONMON_HOST=127.0.0.1
      - MONMON_PORT=9000
    network_mode: host
    restart: always

  monmon:
    container_name: monmon-rs
    image: monmon-rs:latest
    build:
      context: ./modules/monmon-rs
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=9000
      - LEGMON_URL=http://127.0.0.1:9005
    volumes:
      - ./public:/app/public:ro
      - ./.env:/app/.env:ro
    network_mode: host
    depends_on:
      - rauthy
      - legmon
    restart: always
