@import helpers.UIHelpers
@import org.pac4j.core.context.session._;
@()(implicit request: Http.Request, playSessionStore: SessionStore)

<div style="padding: 0 2rem; margin-bottom: 0.5rem; display: flex; justify-content: flex-end;">
    <div class="user-chip">
        <i class="fas fa-user-circle" style="color: var(--primary);"></i>
        <span>@UIHelpers.userDetails(playSessionStore, request)</span>
    </div>
</div>

@if(!UIHelpers.isUserApproved(playSessionStore, request)) {
<script>
    (function() {
        var m = document.getElementById('monmon-waiting-list-modal');
        if (m) {
            m.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
    })();
</script>
}
