<!-- Floating Action Button for Ed (Bottom Right) -->
<button type="button" id="btn-ed-fab" class="fab-ed" title="Ed says" aria-label="Ask Ed">
    <img src="/assets/images/monmon-monster.svg" alt="Ed" />
</button>

<!-- Ed Says Modal -->
<div id="ed-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-content-card ed-modal-card">
        <div class="ed-modal-header">
            <div class="ed-modal-title">
                <img src="/assets/images/monmon-monster.svg" alt="Ed" class="ed-modal-avatar" />
                <span>Ed says</span>
            </div>
            <div class="ed-modal-actions">
                <button type="button" class="ed-refresh-btn w3-button w3-tiny w3-round" title="Ask Ed for fresh advice">
                    <i class="fas fa-sync-alt ed-refresh-icon"></i> Ask Ed
                </button>
                <button type="button" id="ed-close-btn" class="ed-close-btn w3-button w3-round" title="Close modal">&times;</button>
            </div>
        </div>

        <div class="ed-modal-body">
            <div class="ed-says-content" style="font-size: 0.9rem; line-height: 1.6; color: var(--text-main);">
                <div style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); padding: 0.6rem 0;">
                    <i class="fas fa-spinner fa-spin" style="color: var(--primary);"></i>
                    <span>Summoning Ed's thoughts...</span>
                </div>
            </div>
            <div class="ed-says-footer" style="display: none; margin-top: 0.85rem; padding-top: 0.5rem; border-top: 1px dashed var(--border-color); font-size: 0.74rem; color: var(--text-muted); text-align: right;">
                <i class="far fa-clock" style="margin-right: 4px;"></i><span class="ed-last-spoke-text"></span>
            </div>
        </div>
    </div>
</div>
