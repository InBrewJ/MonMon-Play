# This is the main configuration file for the application.
# https://www.playframework.com/documentation/latest/ConfigFile

db {
  #default.driver = org.h2.Driver
  #default.url = "jdbc:h2:mem:play"

  default.driver = org.postgresql.Driver
  default.driver = ${?DB_DRIVER}
  default.url = "jdbc:postgresql://localhost:5432/monmon-play"
  default.url = ${?DB_URL}
  default.username = postgres
  default.username = ${?DB_USERNAME}
  default.password = "docker"
  default.password = ${?DB_PASSWORD}
  default.password = ${?POSTGRES_PASSWORD}

  # Provided for JPA access
  default.jndiName = DefaultDS
}

# Point JPA at our database configuration
jpa.default = defaultPersistenceUnit

# Number of database connections
# See https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing
# db connections = ((physical_core_count * 2) + effective_spindle_count)
fixedConnectionPool = 3

# Set Hikari to fixed size
play.db {
  prototype {
    hikaricp.minimumIdle = ${fixedConnectionPool}
    hikaricp.maximumPoolSize = ${fixedConnectionPool}
  }
}

# Job queue sized to HikariCP connection pool
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = ${fixedConnectionPool}
  }
}

play {
  modules {
    enabled += modules.SecurityModule
    enabled += modules.MigrationModule
  }
  http {
    session {
      maxAge = 1209600s # 14 days
      sameSite = "lax"
      httpOnly = true
      secure = true
    }
  }
}

baseUrl = "https://boom.dryark.uk"
baseUrl = ${?BASE_URL}

oidc.discoveryUri = "https://identity.boom.dryark.uk/auth/realms/monmon/.well-known/openid-configuration"
oidc.discoveryUri = ${?OIDC_DISCOVERY_URI}
oidc.clientId = "monmon-web"
oidc.clientId = ${?OIDC_CLIENT_ID}
oidc.clientSecret = ""
oidc.clientSecret = ${?OIDC_CLIENT_SECRET}
oidc.clientSecret = ${?KEYCLOAK_MONMON_PLAY_CLIENT_SECRET}

play.http.secret.key = "changeme_in_production_set_via_env"
play.http.secret.key = ${?APPLICATION_SECRET}
play.http.secret.key = ${?PLAY_SECRET_KEY}

# Mistral AI Integration
mistral {
  apiKey = ""
  apiKey = ${?MISTRAL_API_KEY}
  model = "mistral-small-latest"
  model = ${?MISTRAL_MODEL}
}

# Monzo Developer API Integration
monzo {
  clientId = ""
  clientId = ${?MONZO_CLIENT_ID}
  clientSecret = ""
  clientSecret = ${?MONZO_CLIENT_SECRET}
  redirectUri = "https://boom.dryark.uk/bank/monzo/callback"
  redirectUri = ${?MONZO_REDIRECT_URI}
}

# LegMon Statement OCR & Mistral Integration
legmon {
  url = "http://localhost:9005"
  url = ${?LEGMON_URL}
}

play.filters.csrf.exemptPaths += "/api/monzo/webhook"
play.filters.csrf.exemptPaths += "/api/statement/webhook"
play.filters.csrf.exemptPaths += "/api/bank/statement"

play.filters.enabled += "filters.AllowListFilter"

play.filters.hosts {
  # Allow requests to hostnames, subdomains, and local addresses on any port
  allowed = [
    "localhost", ".localhost",
    "127.0.0.1", ".127.0.0.1",
    "monmon.urawizard.com:9000", "monmon.urawizard.com",
    "boom.dryark.uk:9000", "boom.dryark.uk",
    ".dryark.uk", "."
  ]
}
