<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="monmon-build-hash" content="{{ crate::BUILD_HASH }}">
<link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
<link rel="shortcut icon" type="image/png" href="/assets/images/favicon.png">

<!-- Apple Touch Icon & iOS Web App Meta (renders on iPhone 'Add to Home Screen') -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/assets/images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MonMon">
<link rel="manifest" href="/assets/site.webmanifest">

<!-- Theme Initialization: default dark mode -->
<script>
    (function() {
        try {
            var savedTheme = localStorage.getItem('monmon-theme');
            var theme = savedTheme ? savedTheme : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
</script>

<!-- Google Fonts (Self-Hosted) -->
<link href="/assets/vendor/fonts/fonts.css?v={{ crate::BUILD_HASH }}" rel="stylesheet">

<!-- Stylesheets -->
